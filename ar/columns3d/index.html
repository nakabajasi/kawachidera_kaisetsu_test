<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23eef0ea'/%3E%3Crect x='7' y='6' width='18' height='8' fill='none' stroke='%231d2a30' stroke-width='2'/%3E%3Crect x='10' y='18' width='12' height='9' fill='%231f6f5e'/%3E%3C/svg%3E">
  <title>柱を立体でカメラに重ねる</title>
  <link rel="stylesheet" href="../ar.css">
</head>
<body class="ar3d">
  <header class="bar">
    <h1 id="title">柱を立体でカメラに重ねる</h1>
    <a href="../../index.html#/experience" id="back">戻る</a>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas class="view3d" id="view" hidden role="img" aria-label="柱を立体で並べた図"></canvas>
    <div class="intro" id="intro">
      <p id="lead">柱を円柱の立体で並べ、カメラの映像に重ねて表示します。画面を指でなぞって回し、いま見ている位置からの見え方に合わせます。</p>
      <button type="button" class="btn" id="start">カメラを使う</button>
      <button type="button" class="btn btn--line" id="nocam">カメラを使わずに立体だけ見る</button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </div>

  <div class="panel" id="panel" hidden>
    <p class="readout" id="readout" aria-live="polite"></p>
    <div class="row">
      <div class="seg" role="group" aria-label="画面を指でなぞったときの動き">
        <span>なぞると</span>
        <button type="button" id="modeRotate" aria-pressed="true">回す</button>
        <button type="button" id="modeMove" aria-pressed="false">ずらす</button>
      </div>
      <button type="button" class="btn btn--line" id="reset">最初に戻す</button>
    </div>
    <label>見る方角<input type="range" id="az" min="0" max="359" step="1"><output id="azOut" for="az"></output></label>
    <label>見下ろす角度<input type="range" id="el" min="-15" max="89" step="1"><output id="elOut" for="el"></output></label>
    <label>距離<input type="range" id="dist" min="4" max="80" step="0.5"><output id="distOut" for="dist"></output></label>
    <label>柱の高さ<input type="range" id="height" min="2" max="6" step="0.1"><output id="heightOut" for="height"></output></label>
    <p class="note" id="heightNote"></p>
    <details id="more">
      <summary>こまかい調整</summary>
      <div class="in">
        <label>写る範囲<input type="range" id="fov" min="30" max="100" step="1"><output id="fovOut" for="fov"></output></label>
        <label>画面の傾き<input type="range" id="roll" min="-30" max="30" step="1"><output id="rollOut" for="roll"></output></label>
        <label>濃さ<input type="range" id="opacity" min="20" max="100" step="5" value="90"><output id="opacityOut" for="opacity"></output></label>
        <div class="row">
          <button type="button" class="btn btn--line" id="tone">柱の色を切り替える</button>
          <button type="button" class="btn btn--line" id="planes" aria-pressed="true">基壇と建物の範囲</button>
        </div>
        <p class="cap">2本の指でつまむと距離が、2本の指でなぞると位置が変わります。「写る範囲」は端末のカメラによって違うので、柱の間隔が合わないときに動かしてください。</p>
      </div>
    </details>
    <details id="about">
      <summary>この表示のもとになっているもの</summary>
      <div class="in">
        <ul class="basis" id="basis"></ul>
        <p class="cap" id="caption"></p>
      </div>
    </details>
    <pre class="debug" id="debug" hidden></pre>
  </div>

  <script src="../ar-common.js"></script>
  <script src="../../js/columns3d.js"></script>
  <script>
  (async function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const C = Heritage.Columns3D;
    const params = new URLSearchParams(location.search);
    const DEBUG = params.get("debug") === "true";
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (v, d) => Number(v).toFixed(d == null ? 1 : d);

    if (DEBUG) $("back").href = "../../index.html?debug=true#/experience";

    // 立体の形は media.json から引く（?model=kondo_columns_3d → media_kondo_columns_3d）
    const key = (params.get("model") || "kondo_columns_3d").replace(/[^a-z0-9_]/gi, "");
    const media = (await HeritageAR.loadJSON("../../data/media.json")) || (await HeritageAR.loadBundle("../../data/data.bundle.js", "media"));
    const item = media && media.media.find((m) => m.id === "media_" + key && m.model && m.model.kind === "column_grid");
    if (!item) {
      $("lead").textContent = "立体の形のデータ（data/media.json）を読めませんでした。";
      $("start").hidden = true; $("nocam").hidden = true;
      return;
    }
    const model = item.model;
    const scene = C.buildScene(model);
    const canvas = $("view"), stage = $("stage");
    const STORE = "heritage.columns3d." + item.id;
    const TONES = Object.keys(C.TONES);

    let view = C.defaultView(model);
    const ui = { tone: "tan", planes: true, opacity: 90, mode: "rotate" };

    // 前に合わせた見え方があれば、そこから始める（端末の中にだけ保存する）
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || "null");
      if (saved && saved.view) {
        Object.keys(view).forEach((k) => { if (typeof saved.view[k] === "number" && isFinite(saved.view[k])) view[k] = saved.view[k]; });
        if (TONES.includes(saved.tone)) ui.tone = saved.tone;
        if (typeof saved.planes === "boolean") ui.planes = saved.planes;
        if (saved.opacity >= 20 && saved.opacity <= 100) ui.opacity = saved.opacity;
      }
    } catch (e) { /* 保存できない端末では、毎回最初の見え方から始める */ }
    let saveTimer = 0;
    function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(STORE, JSON.stringify({ view, tone: ui.tone, planes: ui.planes, opacity: ui.opacity })); } catch (e) { /* 保存しない */ }
      }, 400);
    }

    // ───────── 題名と、もとになっているものの説明 ─────────
    $("title").textContent = item.title;
    document.title = item.title + "｜カメラに重ねる";
    canvas.setAttribute("aria-label", item.title);
    $("height").min = model.column.height_min; $("height").max = model.column.height_max;
    $("heightNote").textContent = model.column.height_note || "";
    const TAG = { report: ["報告書", ""], assumed: ["このアプリでの設定", " tag--assumed"] };
    $("basis").innerHTML =
      model.planes.map((p) => `<li><span class="sw sw--${esc(p.id)}"></span><b>${esc(p.label)}</b>　東西${esc(p.w)}ｍ × 南北${esc(p.d)}ｍ。柱の根元の高さに置いた平らな面</li>`).join("") +
      (model.basis || []).map((b) => `<li><span class="tag${(TAG[b.from] || TAG.assumed)[1]}">${(TAG[b.from] || TAG.assumed)[0]}</span><b>${esc(b.item)}</b>　${esc(b.text)}` +
        (DEBUG && b.fact_ids && b.fact_ids.length ? `<br><code>${esc(b.fact_ids.join(", "))}</code>` : "") + `</li>`).join("");
    $("caption").textContent = item.caption.replace(/。?$/, "。") + "現地の遺構の位置に自動で合うものではありません。手で合わせてください。";

    // ───────── 描く ─────────
    let frame = 0;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(stage.clientWidth * dpr)), h = Math.max(1, Math.round(stage.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      canvas.dataset.dpr = dpr;
    }
    function draw() {
      frame = 0;
      if (canvas.hidden) return;
      resize();
      C.normalize(view, model);
      C.render(canvas, scene, view, { tone: ui.tone, planes: ui.planes, scale: Number(canvas.dataset.dpr) });
      canvas.style.opacity = ui.opacity / 100;
      sync();
      save();
    }
    function schedule() { if (!frame) frame = requestAnimationFrame(draw); }

    function sync() {
      const eye = C.eyeHeight(view);
      const dir = C.directionName(view.az);
      $("readout").textContent = `${dir}から／中心まで${num(view.dist)}ｍ／目の高さ${num(eye)}ｍ` + (eye < 0 ? "（柱の根元より下）" : "");
      const set = (id, v, text) => { $(id).value = v; $(id + "Out").textContent = text; };
      set("az", Math.round(view.az) % 360, `${dir}から`);
      set("el", Math.round(view.el), `${Math.round(view.el)}°`);
      set("dist", view.dist, `${num(view.dist)} ｍ`);
      set("height", view.height, `${num(view.height)} ｍ`);
      set("fov", Math.round(view.fov), `${Math.round(view.fov)}°`);
      set("roll", Math.round(view.roll), `${Math.round(view.roll)}°`);
      set("opacity", ui.opacity, `${ui.opacity}%`);
      $("planes").setAttribute("aria-pressed", String(ui.planes));
      $("planes").textContent = ui.planes ? "基壇と建物の範囲を隠す" : "基壇と建物の範囲を出す";
      $("modeRotate").setAttribute("aria-pressed", String(ui.mode === "rotate"));
      $("modeMove").setAttribute("aria-pressed", String(ui.mode === "move"));
      if (DEBUG) {
        $("debug").hidden = false;
        $("debug").textContent = `media: ${item.id}\n柱 ${scene.columns.length}本（内側 ${scene.columns.filter((c) => c.inner).length}本 × ${scene.innerRatio}）\n` +
          `az ${num(view.az)} / el ${num(view.el)} / dist ${num(view.dist)} / pan ${num(view.pan)} / tilt ${num(view.tilt)} / roll ${num(view.roll)} / fov ${num(view.fov)} / height ${num(view.height)}\n` +
          `source: ${(item.source_refs || []).map((r) => r.source_id + " p." + r.page).join(", ")}`;
      }
    }

    // ───────── 始める ─────────
    function show(plain) {
      $("intro").hidden = true; canvas.hidden = false; $("panel").hidden = false;
      document.body.classList.add("is-ready");
      stage.classList.toggle("is-plain", !!plain);
      schedule();
    }
    $("start").addEventListener("click", async () => {
      $("err").textContent = "";
      try { await HeritageAR.startCamera($("video"), "environment"); show(false); }
      catch (e) { $("err").textContent = e.message; }
    });
    $("nocam").addEventListener("click", () => show(true));

    // ───────── スライダーとボタン ─────────
    const bind = (id, fn) => $(id).addEventListener("input", (e) => { fn(Number(e.target.value)); schedule(); });
    bind("az", (v) => { view.az = v; });
    bind("el", (v) => { view.el = v; });
    bind("dist", (v) => { view.dist = v; });
    bind("height", (v) => { view.height = v; });
    bind("fov", (v) => { view.fov = v; });
    bind("roll", (v) => { view.roll = v; });
    bind("opacity", (v) => { ui.opacity = v; });
    $("tone").addEventListener("click", () => { ui.tone = TONES[(TONES.indexOf(ui.tone) + 1) % TONES.length]; schedule(); });
    $("planes").addEventListener("click", () => { ui.planes = !ui.planes; schedule(); });
    $("modeRotate").addEventListener("click", () => { ui.mode = "rotate"; schedule(); });
    $("modeMove").addEventListener("click", () => { ui.mode = "move"; schedule(); });
    $("reset").addEventListener("click", () => {
      view = C.defaultView(model); ui.tone = "tan"; ui.planes = true; ui.opacity = 90;
      schedule();
    });

    // ───────── 指やマウスで動かす ─────────
    // 1本の指：「回す」のときは見る位置が建物のまわりを回り、「ずらす」のときは絵が画面の中で動く。
    // 2本の指：つまむと距離、なぞると位置。マウスは、ホイールで距離、Shift を押しながらなぞると「ずらす」。
    const pts = new Map();
    let pinch = null;
    const degPerPx = () => {
      const focal = (Math.max(stage.clientWidth, stage.clientHeight) / 2) / Math.tan((view.fov * Math.PI) / 360);
      return (180 / Math.PI) / focal;
    };
    function moveBy(dx, dy) { const k = degPerPx(); view.pan -= dx * k; view.tilt += dy * k; }
    function twoState() {
      const [a, b] = Array.from(pts.values());
      return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    canvas.addEventListener("pointerdown", (e) => {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動かせる */ }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      pinch = pts.size === 2 ? twoState() : null;
    });
    canvas.addEventListener("pointermove", (e) => {
      const p = pts.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (pts.size === 1) {
        if (ui.mode === "rotate" && !e.shiftKey) { view.az -= dx * 0.4; view.el += dy * 0.3; }
        else moveBy(dx, dy);
      } else if (pts.size === 2 && pinch) {
        const now = twoState();
        if (now.d > 8 && pinch.d > 8) view.dist *= pinch.d / now.d;
        moveBy(now.x - pinch.x, now.y - pinch.y);
        pinch = now;
      }
      schedule();
    });
    const end = (e) => { pts.delete(e.pointerId); pinch = pts.size === 2 ? twoState() : null; };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end);
    canvas.addEventListener("wheel", (e) => { e.preventDefault(); view.dist *= Math.exp(e.deltaY * 0.0015); schedule(); }, { passive: false });

    if (window.ResizeObserver) new ResizeObserver(schedule).observe(stage);
    window.addEventListener("resize", schedule);
    window.addEventListener("orientationchange", schedule);

    // 動作確認用（tools/browser_test.mjs から使う）
    window.__columns3d = { get view() { return view; }, scene, model, ui, draw };
    sync();
  })();
  </script>
</body>
</html>
