<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23eef0ea'/%3E%3Crect x='7' y='6' width='18' height='8' fill='none' stroke='%231d2a30' stroke-width='2'/%3E%3Crect x='10' y='18' width='12' height='9' fill='%231f6f5e'/%3E%3C/svg%3E">
  <title>図をカメラに重ねる</title>
  <link rel="stylesheet" href="../ar.css">
</head>
<body>
  <header class="bar">
    <h1 id="title">図をカメラに重ねる</h1>
    <a href="../../index.html#/experience" id="back">戻る</a>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <img class="overlay is-white" id="overlay" alt="" hidden draggable="false">
    <div class="intro" id="intro">
      <p id="lead">図をカメラの映像に重ねて表示します。位置・大きさ・向きは画面上で合わせます。</p>
      <button type="button" class="btn" id="start">カメラを使う</button>
      <button type="button" class="btn btn--line" id="nocam">カメラを使わずに図だけ見る</button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </div>

  <div class="panel" id="panel" hidden>
    <label>濃さ<input type="range" id="opacity" min="10" max="100" value="80"></label>
    <label>大きさ<input type="range" id="size" min="20" max="250" value="70"></label>
    <label>向き<input type="range" id="angle" min="-180" max="180" value="0"></label>
    <div class="row">
      <button type="button" class="btn btn--line" id="tone">線の色を切り替える</button>
      <button type="button" class="btn btn--line" id="reset">位置を戻す</button>
    </div>
    <p class="cap" id="caption"></p>
  </div>

  <script src="../ar-common.js"></script>
  <script>
  (async function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const img = $("overlay");
    const state = { x: 0, y: 0, size: 70, angle: 0 };

    if (params.get("debug") === "true") $("back").href = "../../index.html?debug=true#/experience";

    // 重ねる図は media.json から引く（?overlay=kondo_columns → media_kondo_columns）
    const key = (params.get("overlay") || "kondo_columns").replace(/[^a-z0-9_]/gi, "");
    const media = await HeritageAR.loadJSON("../../data/media.json");
    const item = media && media.media.find((m) => m.id === "media_" + key && m.availability === "included" && m.file && m.file.indexOf("generated:") !== 0);
    const file = item ? item.file : "images/kondo_columns.svg";
    img.src = "../../" + file;
    if (item) {
      $("title").textContent = item.title;
      document.title = item.title + "｜カメラに重ねる";
      img.alt = item.title;
      $("caption").textContent = item.caption.replace(/。?$/, "。") + "現地の遺構の位置に正確に合うものではありません。";
    }

    function apply() {
      img.style.width = state.size + "%";
      img.style.transform = "translate(-50%, -50%) translate(" + state.x + "px, " + state.y + "px) rotate(" + state.angle + "deg)";
    }
    apply();

    function show() { $("intro").hidden = true; img.hidden = false; $("panel").hidden = false; }
    $("start").addEventListener("click", async () => {
      $("err").textContent = "";
      try { await HeritageAR.startCamera($("video"), "environment"); show(); }
      catch (e) { $("err").textContent = e.message; }
    });
    $("nocam").addEventListener("click", () => { img.classList.remove("is-white"); $("stage").style.background = "#eef0ea"; show(); });

    $("opacity").addEventListener("input", (e) => { img.style.opacity = e.target.value / 100; });
    $("size").addEventListener("input", (e) => { state.size = Number(e.target.value); apply(); });
    $("angle").addEventListener("input", (e) => { state.angle = Number(e.target.value); apply(); });
    $("tone").addEventListener("click", () => img.classList.toggle("is-white"));
    $("reset").addEventListener("click", () => { state.x = 0; state.y = 0; state.size = 70; state.angle = 0; $("size").value = 70; $("angle").value = 0; apply(); });
    img.style.opacity = 0.8;

    // 指やマウスで図を動かす
    let drag = null;
    img.addEventListener("pointerdown", (e) => { drag = { px: e.clientX, py: e.clientY, x: state.x, y: state.y }; img.setPointerCapture(e.pointerId); });
    img.addEventListener("pointermove", (e) => { if (!drag) return; state.x = drag.x + e.clientX - drag.px; state.y = drag.y + e.clientY - drag.py; apply(); });
    img.addEventListener("pointerup", () => { drag = null; });
    img.addEventListener("pointercancel", () => { drag = null; });
  })();
  </script>
</body>
</html>
